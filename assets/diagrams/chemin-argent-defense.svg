<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-label="Schéma du chemin de l'argent de la LPM jusqu'au paiement : LPM → Loi de finances → Mission Défense → Programmes → AE / CP → Engagement juridique → Paiement">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
      .hand { font-family: 'Caveat', cursive, 'Comic Sans MS', cursive; }
      .box-label { font-size: 15px; font-weight: 700; fill: #1F2933; }
      .box-sub { font-size: 11px; fill: #667085; }
      .step-num { font-size: 11px; font-weight: 700; letter-spacing: .05em; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#FCFBF8" rx="16"/>

  <!-- Step 1: LPM -->
  <rect x="220" y="24" width="200" height="58" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="48" text-anchor="middle" class="step-num" fill="#2563EB">ÉTAPE 1</text>
  <text x="320" y="70" text-anchor="middle" class="box-label">LPM</text>

  <!-- Arrow -->
  <line x1="320" y1="82" x2="320" y2="112" stroke="#667085" stroke-width="2" marker-end="url(#arr)"/>
  <text x="340" y="100" class="hand" font-size="12" fill="#98A6B9">programmation</text>

  <!-- Step 2: PLF/LFI -->
  <rect x="210" y="114" width="220" height="58" rx="12" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
  <text x="320" y="138" text-anchor="middle" class="step-num" fill="#0891B2">ÉTAPE 2</text>
  <text x="320" y="160" text-anchor="middle" class="box-label">PLF / LFI</text>

  <!-- Arrow -->
  <line x1="320" y1="172" x2="320" y2="202" stroke="#667085" stroke-width="2" marker-end="url(#arr)"/>
  <text x="340" y="190" class="hand" font-size="12" fill="#98A6B9">traduction annuelle</text>

  <!-- Step 3: Mission Défense -->
  <rect x="195" y="204" width="250" height="58" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="320" y="228" text-anchor="middle" class="step-num" fill="#7C3AED">ÉTAPE 3</text>
  <text x="320" y="250" text-anchor="middle" class="box-label">Mission Défense</text>

  <!-- Arrow -->
  <line x1="320" y1="262" x2="320" y2="292" stroke="#667085" stroke-width="2" marker-end="url(#arr)"/>
  <text x="340" y="280" class="hand" font-size="12" fill="#98A6B9">décomposition</text>

  <!-- Step 4: Programmes -->
  <rect x="185" y="294" width="270" height="58" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="320" y="318" text-anchor="middle" class="step-num" fill="#059669">ÉTAPE 4</text>
  <text x="320" y="340" text-anchor="middle" class="box-label">Programmes 144 · 146 · 178 · 212</text>

  <!-- Arrow -->
  <line x1="320" y1="352" x2="320" y2="382" stroke="#667085" stroke-width="2" marker-end="url(#arr)"/>
  <text x="340" y="370" class="hand" font-size="12" fill="#98A6B9">crédits votés</text>

  <!-- Step 5: AE / CP -->
  <rect x="215" y="384" width="210" height="58" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="320" y="408" text-anchor="middle" class="step-num" fill="#D97706">ÉTAPE 5</text>
  <text x="320" y="430" text-anchor="middle" class="box-label">AE / CP</text>

  <!-- Arrow -->
  <line x1="320" y1="442" x2="320" y2="472" stroke="#667085" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 6: Paiement -->
  <rect x="225" y="474" width="190" height="58" rx="12" fill="#FEF2EE" stroke="#E8603A" stroke-width="2"/>
  <text x="320" y="498" text-anchor="middle" class="step-num" fill="#E8603A">ÉTAPE 6</text>
  <text x="320" y="520" text-anchor="middle" class="box-label">Paiement effectif</text>

  <!-- Side annotations -->
  <text x="28" y="54" class="hand" font-size="13" fill="#98A6B9">pluriannuel</text>
  <text x="28" y="154" class="hand" font-size="13" fill="#98A6B9">annuel</text>
  <text x="28" y="254" class="hand" font-size="13" fill="#98A6B9">vote parlement</text>
  <text x="530" y="414" class="hand" font-size="13" fill="#D97706">engagement ≠ paiement</text>
</svg>
