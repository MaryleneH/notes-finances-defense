<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Schéma de la trajectoire de dépenses nettes : partant des dépenses des administrations publiques, avec retraitements (intérêts, mesures discrétionnaires en recettes, flux UE, dépenses cycliques de chômage, mesures ponctuelles), on obtient les dépenses nettes, agrégées dans une trajectoire pluriannuelle servant à la surveillance budgétaire européenne">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
      .hand { font-family: 'Caveat', cursive, 'Comic Sans MS', cursive; }
      .box-label { font-size: 14px; font-weight: 700; fill: #1F2933; }
      .item { font-size: 11px; fill: #667085; }
    </style>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#FCFBF8" rx="16"/>

  <!-- Top box: dépenses APU -->
  <rect x="195" y="20" width="250" height="54" rx="12" fill="#F5F6F4" stroke="#1F2933" stroke-width="2"/>
  <text x="320" y="44" text-anchor="middle" class="box-label">Dépenses des APU</text>
  <text x="320" y="62" text-anchor="middle" class="item">au sens large (comptabilité nationale)</text>

  <line x1="320" y1="74" x2="320" y2="105" stroke="#667085" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Retraitements box -->
  <rect x="155" y="107" width="330" height="154" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="320" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#D97706">RETRAITEMENTS (sélection)</text>

  <text x="175" y="152" class="item">— charges d'intérêts de la dette</text>
  <text x="175" y="170" class="item">— mesures discrétionnaires en recettes</text>
  <text x="175" y="188" class="item">— flux liés aux programmes UE (certains)</text>
  <text x="175" y="206" class="item">— cofinancements nationaux de programmes UE</text>
  <text x="175" y="224" class="item">— composante cyclique des dépenses chômage</text>
  <text x="175" y="242" class="item">— mesures ponctuelles et temporaires</text>

  <line x1="320" y1="261" x2="320" y2="292" stroke="#667085" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="345" y="280" class="hand" font-size="12" fill="#98A6B9">calcul réglementaire</text>

  <!-- Dépenses nettes box -->
  <rect x="195" y="294" width="250" height="54" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="320" y="318" text-anchor="middle" class="box-label" style="fill:#2563EB">DÉPENSES NETTES</text>
  <text x="320" y="337" text-anchor="middle" class="item">indicateur de surveillance</text>

  <line x1="320" y1="348" x2="320" y2="378" stroke="#667085" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Surveillance box -->
  <rect x="175" y="380" width="290" height="44" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="320" y="400" text-anchor="middle" class="box-label">Trajectoire pluriannuelle</text>
  <text x="320" y="416" text-anchor="middle" class="item">→ surveillance budgétaire européenne (CGO 2024)</text>

  <!-- Side annotation -->
  <text x="20" y="200" class="hand" font-size="13" fill="#D97706" transform="rotate(-90, 20, 200)">retraiter ≠ exclure</text>
</svg>
