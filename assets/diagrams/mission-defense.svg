<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" aria-label="Architecture de la Mission Défense : Programme 144 (ANTICIPER) en haut, Programme 178 (AGIR) en bas, Programme 212 (SOUTENIR) à gauche, Programme 146 (ÉQUIPER) à droite — tous reliés à la Mission Défense au centre">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
      .hand { font-family: 'Caveat', cursive, 'Comic Sans MS', cursive; }
      .p-num { font-size: 28px; font-weight: 700; }
      .p-idea { font-size: 18px; font-weight: 600; }
      .p-title { font-size: 11px; fill: #667085; }
      .center-t { font-size: 16px; font-weight: 700; fill: #1F2933; }
    </style>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect width="680" height="500" fill="#FCFBF8" rx="16"/>

  <!-- Center: Mission Défense -->
  <rect x="255" y="200" width="170" height="80" rx="14" fill="#F5F6F4" stroke="#1F2933" stroke-width="2"/>
  <text x="340" y="233" text-anchor="middle" font-size="11" font-weight="700" letter-spacing=".08em" fill="#667085">MISSION</text>
  <text x="340" y="258" text-anchor="middle" class="center-t">DÉFENSE</text>
  <text x="340" y="276" text-anchor="middle" class="hand" font-size="13" fill="#98A6B9">4 programmes</text>

  <!-- 144 — ANTICIPER (top) -->
  <rect x="245" y="34" width="190" height="100" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="340" y="65" text-anchor="middle" class="p-num" fill="#2563EB">144</text>
  <text x="340" y="92" text-anchor="middle" class="p-idea" fill="#2563EB">ANTICIPER</text>
  <text x="340" y="110" text-anchor="middle" class="p-title">Environnement &amp; prospective</text>
  <text x="340" y="124" text-anchor="middle" class="p-title">de la politique de défense</text>
  <!-- arrow down -->
  <line x1="340" y1="134" x2="340" y2="198" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ac)"/>

  <!-- 178 — AGIR (bottom) -->
  <rect x="245" y="358" width="190" height="100" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="340" y="389" text-anchor="middle" class="p-num" fill="#059669">178</text>
  <text x="340" y="416" text-anchor="middle" class="p-idea" fill="#059669">AGIR</text>
  <text x="340" y="434" text-anchor="middle" class="p-title">Préparation et emploi</text>
  <text x="340" y="448" text-anchor="middle" class="p-title">des forces</text>
  <!-- arrow up -->
  <line x1="340" y1="281" x2="340" y2="356" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ac)"/>

  <!-- 212 — SOUTENIR (left) -->
  <rect x="34" y="196" width="180" height="100" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="124" y="227" text-anchor="middle" class="p-num" fill="#D97706">212</text>
  <text x="124" y="254" text-anchor="middle" class="p-idea" fill="#D97706">SOUTENIR</text>
  <text x="124" y="272" text-anchor="middle" class="p-title">Soutien de la politique</text>
  <text x="124" y="286" text-anchor="middle" class="p-title">de la défense</text>
  <!-- arrow right -->
  <line x1="214" y1="240" x2="253" y2="240" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ac)"/>

  <!-- 146 — ÉQUIPER (right) -->
  <rect x="466" y="196" width="180" height="100" rx="14" fill="#FEF2EE" stroke="#E8603A" stroke-width="1.5"/>
  <text x="556" y="227" text-anchor="middle" class="p-num" fill="#E8603A">146</text>
  <text x="556" y="254" text-anchor="middle" class="p-idea" fill="#E8603A">ÉQUIPER</text>
  <text x="556" y="272" text-anchor="middle" class="p-title">Équipement</text>
  <text x="556" y="286" text-anchor="middle" class="p-title">des forces</text>
  <!-- arrow left -->
  <line x1="466" y1="240" x2="427" y2="240" stroke="#E8603A" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ac)"/>

  <!-- Bottom hand note -->
  <text x="340" y="480" text-anchor="middle" class="hand" font-size="14" fill="#98A6B9">crédits votés par le Parlement — spécialité par programme</text>
</svg>
